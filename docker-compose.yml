services:
  db:
    image: postgres:18-alpine3.24
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_DB=ticket_tracker
      - POSTGRES_PASSWORD=password
    volumes:
      - pgdata18:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ticket_tracker"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # Used both by the sqlx query macros at compile time and by the server at runtime.
      - DATABASE_URL=postgres://admin:password@db/ticket_tracker
      - BIND_ADDR=0.0.0.0:3001
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/cargo-target
    ports:
      - 3001:3001
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: web
      dockerfile: Dockerfile.dev
    ports:
      - 3000:3000
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata18:
  cargo-registry:
  cargo-target:
